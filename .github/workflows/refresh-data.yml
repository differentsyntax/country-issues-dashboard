name: Refresh dashboard data

# Re-fetches every real indicator from its live source (see
# scripts/fetch_india_data.py) and commits the result if anything changed.
# A push to main triggers Netlify's normal git-based deploy, so the site
# updates automatically — every data change is a visible, timestamped git
# commit, not a silent overwrite.

on:
  schedule:
    - cron: "17 4 * * *" # daily, off the hour to be polite to upstream APIs
  workflow_dispatch: {} # allow manual runs from the Actions tab

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install fetch script dependencies
        run: pip install -r scripts/requirements.txt

      - name: Fetch latest real data
        run: python3 scripts/fetch_india_data.py

      - name: Commit if data changed
        run: |
          if git diff --quiet -- src/data/countries/india/indicators.json; then
            echo "No data changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/data/countries/india/indicators.json
          git commit -m "chore: refresh real data ($(date -u +%Y-%m-%d))"
          git push
