[build]
  command = "npm run build"
  publish = ".next"

[[plugins]]
  package = "@netlify/plugin-nextjs"

# AQICN_TOKEN must be set as a site environment variable in the Netlify UI
# (Site configuration -> Environment variables). Get a free token at
# https://aqicn.org/data-platform/token/ — without it, Air Quality shows as
# "not configured" instead of live data; everything else on the dashboard
# still works.
